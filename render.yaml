# Blueprint Render (https://render.com/docs/blueprint-spec)
# Déploiement du serveur de visualisation du réseau STM.
#
# Notes :
#  - Le serveur charge en mémoire graphe routier + segments + conso synthétique :
#    prévoir >= 512 Mo. Le plan gratuit (512 Mo) risque l'OOM au démarrage → le
#    plan « standard » (2 Go) est recommandé ; « starter » (512 Mo) peut suffire
#    mais reste juste.
#  - --preload : les données sont chargées une seule fois par le maître gunicorn
#    (le worker n'est donc pas tué par le timeout pendant le chargement).
#  - --workers 1 : un seul worker pour ne pas dupliquer ~0,5 Go de données.
#  - Le serveur est en LECTURE SEULE : le disque éphémère de Render convient
#    (les lignes créées sont stockées côté navigateur, en localStorage).
services:
  - type: web
    name: reseau-stm-viz
    runtime: python
    plan: standard
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir serveur serveur_viz:app --workers 1 --preload --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
